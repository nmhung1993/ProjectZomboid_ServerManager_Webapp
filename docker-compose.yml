services:
  # ---------------------------------------------------------------------------
  # PZ Game Server — Dedicated server via SteamCMD
  # Image and arch-specific config provided by docker-compose.{arm64,amd64}.yml
  # ---------------------------------------------------------------------------
  game-server:
    container_name: ${GAME_SERVER_CONTAINER_NAME:-pz-game-server}
    restart: unless-stopped
    ports:
      - "${PZ_GAME_PORT:-16261}:${PZ_GAME_PORT:-16261}/udp"
      - "${PZ_DIRECT_PORT:-16262}:${PZ_DIRECT_PORT:-16262}/udp"
    volumes:
      - zomboid-data:/home/steam/Zomboid
      - lua-bridge:/home/steam/Zomboid/Lua
    networks:
      - zomboid-net

  # ---------------------------------------------------------------------------
  # Laravel Application — API + Web Dashboard
  # ---------------------------------------------------------------------------
  app:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: pz-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8000}:8000"
      - "${APP_PROXY_PORT:-8082}:8000"
    volumes:
      - app-storage:/var/www/html/storage
      - zomboid-data:/pz-data
      - zomboid-server:/pz-server:ro
      - ./backups:/backups
      - lua-bridge:/lua-bridge
      # Local bind mount for pre-downloaded/merged map tiles (offline).
      # Use a relative path so Docker Compose resolves it from the project root.
      - ./map-tiles-merged:/map-tiles
    env_file: ./app/.env
    environment:
      DB_HOST: ${DB_HOST:-db}
      REDIS_HOST: ${REDIS_HOST:-redis}
      GAME_SERVER_CONTAINER_NAME: ${GAME_SERVER_CONTAINER_NAME:-pz-game-server}
      DOCKER_PROXY_URL: http://docker-socket-proxy:2375
      PZ_DATA_PATH: /pz-data
      PZ_SERVER_PATH: /pz-server
      PZ_RCON_HOST: game-server
      BACKUP_PATH: /backups
      LUA_BRIDGE_PATH: /lua-bridge
      PZ_MAP_TILES_PATH: /map-tiles
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
      - FOWNER
    networks:
      - zomboid-net
      - backend-net

  # ---------------------------------------------------------------------------
  # Queue Worker — Processes backup jobs, restart jobs, etc.
  # ---------------------------------------------------------------------------
  queue:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: pz-queue
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: php artisan queue:work redis --tries=3 --timeout=600 --sleep=3
    volumes:
      - app-storage:/var/www/html/storage
      - zomboid-data:/pz-data
      - zomboid-server:/pz-server:ro
      - ./backups:/backups
      - lua-bridge:/lua-bridge
      - ./map-tiles-merged:/map-tiles
    env_file: ./app/.env
    environment:
      DB_HOST: ${DB_HOST:-db}
      REDIS_HOST: ${REDIS_HOST:-redis}
      GAME_SERVER_CONTAINER_NAME: ${GAME_SERVER_CONTAINER_NAME:-pz-game-server}
      DOCKER_PROXY_URL: http://docker-socket-proxy:2375
      PZ_DATA_PATH: /pz-data
      PZ_SERVER_PATH: /pz-server
      PZ_RCON_HOST: game-server
      BACKUP_PATH: /backups
      LUA_BRIDGE_PATH: /lua-bridge
      PZ_MAP_TILES_PATH: /map-tiles
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
      - FOWNER
    networks:
      - zomboid-net
      - backend-net

  # ---------------------------------------------------------------------------
  # PostgreSQL — Primary database
  # ---------------------------------------------------------------------------
  db:
    build:
      context: ./db
      dockerfile: Dockerfile
    image: zomboid-manager-db:postgres16
    container_name: pz-db
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${DB_DATABASE:-zomboid}
      POSTGRES_USER: ${DB_USERNAME:-zomboid}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-zomboid}
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USERNAME:-zomboid} -d ${DB_DATABASE:-zomboid}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend-net
      - zomboid-net

  # ---------------------------------------------------------------------------
  # Redis — Queue, cache, rate limiting
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: pz-redis
    restart: unless-stopped
    volumes:
      - redis-data:/data
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    command: /bin/sh -c 'set -- --appendonly yes; [ -n "$$REDIS_PASSWORD" ] && set -- "$$@" --requirepass "$$REDIS_PASSWORD"; exec redis-server "$$@"'
    healthcheck:
      test: [ "CMD-SHELL", 'if [ -n "$$REDIS_PASSWORD" ]; then REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping; else redis-cli ping; fi' ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend-net

  # ---------------------------------------------------------------------------
  # Docker Socket Proxy — Restricted Docker API access for app/queue
  # ---------------------------------------------------------------------------
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:v0.4.2
    container_name: pz-docker-proxy
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      POST: 1
      LOG: 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - backend-net

  # ---------------------------------------------------------------------------
  # Caddy — Reverse proxy with automatic TLS
  # ---------------------------------------------------------------------------
  caddy:
    build:
      context: ./caddy
      dockerfile: Dockerfile
    image: zomboid-manager-caddy:2.11.2
    container_name: pz-caddy
    restart: unless-stopped
    ports:
      - "${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_HTTPS_PORT:-443}:443"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app
    networks:
      - zomboid-net

# -----------------------------------------------------------------------------
# Networks
# -----------------------------------------------------------------------------
networks:
  zomboid-net:
    driver: bridge
  backend-net:
    driver: bridge
    internal: true

# -----------------------------------------------------------------------------
# Volumes
# -----------------------------------------------------------------------------
volumes:
  app-storage:
    name: pz-app-storage
  zomboid-server:
    name: pz-server-files
  zomboid-data:
    name: pz-data
  postgres-data:
    name: pz-postgres
  redis-data:
    name: pz-redis
  lua-bridge:
    name: pz-lua-bridge
  caddy-data:
    name: pz-caddy-data
  caddy-config:
    name: pz-caddy-config
